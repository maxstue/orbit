name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24.21.0
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Build Cloudflare Worker
        run: vp build

      - name: Check formatting, linting, and types
        run: vp check

      - name: Install Playwright browser
        run: vp exec playwright install --with-deps chromium

      - name: Run unit tests with coverage
        run: vp run test:coverage

      - name: Run component browser tests
        run: vp run test:browser

      - name: Upload Vitest coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-coverage-report
          path: coverage/unit
          if-no-files-found: warn
          retention-days: 14

      - name: Run browser end-to-end, visual, and accessibility tests
        run: vp run test:e2e

      - name: Generate Playwright coverage report
        # The report requires raw coverage emitted by the preceding E2E run.
        # Do not mask an earlier build/test failure with an ENOENT for .nyc_output.
        if: success()
        run: vp run test:e2e:coverage-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            coverage/e2e
          if-no-files-found: warn
          retention-days: 14

      - name: Publish SonarQube Cloud analysis
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.projectKey=maxstue_orbit
            -Dsonar.organization=maxstue
            -Dsonar.sources=src
            -Dsonar.tests=src,tests/e2e
            -Dsonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,tests/e2e/**/*.spec.ts
            -Dsonar.coverage.exclusions=src/paraglide/**,src/routeTree.gen.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/e2e/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: orbit-production
      cancel-in-progress: false
    environment:
      name: Production
      url: https://me.justmax.xyz
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24.21.0
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Synchronize server-side Sentry DSN
        if: env.SENTRY_DSN != ''
        run: printf '%s' "$SENTRY_DSN" | vp exec wrangler secret put SENTRY_DSN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Build, upload source maps, and deploy Worker
        run: vp run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
