name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Check formatting, linting, and types
        run: vp check

      - name: Run unit tests
        run: vp test

      - name: Build Cloudflare Worker
        run: vp build

      - name: Install Playwright browser
        run: vp exec playwright install --with-deps chromium

      - name: Run selected browser smoke and accessibility tests
        run: vp exec playwright test --grep @a11y --project desktop-chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: orbit-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://me.justmax.xyz
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Synchronize server-side Sentry DSN
        if: env.SENTRY_DSN != ''
        run: printf '%s' "$SENTRY_DSN" | vp exec wrangler secret put SENTRY_DSN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Build, upload source maps, and deploy Worker
        run: vp run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Smoke-test production routes
        shell: bash
        run: |
          set -euo pipefail
          for route in /en /de /en/workbench; do
            curl --fail --retry 5 --retry-delay 3 --retry-all-errors \
              "https://me.justmax.xyz${route}" >/dev/null
          done
